<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentação – Máquina de Montagem Semiautomática de Charlyn</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      background: url('fundo_arv.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .container {
      margin-top: 40px;
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 25px;
      border-radius: 18px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btns {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    a.button {
      background: #ffffff;
      color: #000;
      padding: 18px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.25s ease;
    }

    a.button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    @media (min-width: 600px) {
      .btns {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>

  <div class="logos">
    <img src="unimil.png" height="70" alt="Unimil">
    <img src="arv.png" height="70" alt="ARV">
  </div>

  <div class="container">
    <h2>
      DOCUMENTAÇÃO DA MÁQUINA PARA<br>
      MONTAGEM SEMIAUTOMÁTICA DE CHARLYN
    </h2>

    <div class="btns">
      <a class="button" 
         href="https://1drv.ms/f/c/c2e9a36b8d85b353/Ene2BmQ3q2FGtXGjpC-qafUBCoqokrI8ctHzNkb4DeepJQ?e=MMzpoA"
         target="_blank">
        📁 OneDrive
      </a>

      <a class="button" 
         href="https://drive.google.com/drive/folders/1r4UzjTY1gAsI3yr7zOOJWvPFgqDmr2Ao?usp=sharing"
         target="_blank">
        ☁ Google Drive
      </a>
    </div>
  </div>

</body>
</html>
